name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Add Capacitor iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App Archive
        run: |
          cd ios
          # البحث عن المسار الصحيح للمشروع
          if [ -d "App" ]; then cd App; fi
          # تنفيذ البناء
          xcodebuild -scheme App -archivePath ./App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          # التأكد من وجود المجلد
          ls -R App.xcarchive

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/**/App.xcarchive
